name: Build unsigned iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | awk -F. '{ exit !($1 >= 27) }'
      - name: Build native app without signing
        run: bash scripts/build-unsigned.sh
      - name: Test native image adapters and rendering
        run: bash scripts/test-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Scrollshot-UNSIGNED-not-ready-to-install
          path: |
            .build/Scrollshot-unsigned.ipa
            .build/home-simulator.png
            .build/embedded-entitlements.plist
          retention-days: 1
